<div class="event-gallery container pt-5">
  <h2 class="bottom-line text-left all-caps">Hall of Fame</h2>

  <div class="row pb-3">
    <div class="col-lg-4 mb-4" *ngFor="let entry of hallOfFameEntries">
      <ul class="card-list d-flex">
        <li class="card-item">
          <div class="card-link">
            <a
              [href]="entry.externalLink || 'hallOfFame'"
              [target]="entry.externalLink ? '_blank' : '_self'"
            >
              <img
                [src]="entry.imageUrl"
                [alt]="entry.studentName + ' - ' + entry.class"
                class="image-fluid card-image"
              />
            </a>
            <div class="img-content">
              <h2 class="card-title mt-3">
                {{ entry.studentName }} - {{ entry.class }}
              </h2>
              <p>{{ entry.achievement }}</p>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>

  <!-- Optional: Show message when no entries are available -->
  <div class="row" *ngIf="hallOfFameEntries.length === 0">
    <div class="col-12 text-center py-5">
      <p class="text-muted">No Hall of Fame entries available at this time.</p>
    </div>
  </div>
</div>
